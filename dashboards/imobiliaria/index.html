<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imobiliária Premium | Vanderson Alves</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0A0A0A;
            color: #FCD34D;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            border-bottom: 2px solid #FBBF24;
        }
        .btn-voltar {
            padding: 0.8rem 1.5rem;
            color: #FBBF24;
            text-decoration: none;
            border: 2px solid #FBBF24;
            border-radius: 5px;
        }
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #1A1A1A, #0A0A0A);
        }
        .hero h2 { font-size: 2.5rem; color: #FBBF24; margin-bottom: 1rem; }
        .imoveis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }
        .imovel-card {
            background: #1A1A1A;
            border: 1px solid #FBBF24;
            border-radius: 10px;
            overflow: hidden;
        }
        .imovel-img {
            height: 200px;
            background: #2D2D2D;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FBBF24;
            font-size: 3rem;
        }
        .imovel-info { padding: 1.5rem; }
        .preco { color: #FBBF24; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-building"></i> Imobiliária Premium</h1>
        <a href="/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>
    
    <div class="hero">
        <h2>Encontre o imóvel dos seus sonhos</h2>
        <p>Casas, apartamentos e coberturas nos melhores bairros</p>
    </div>

    <div class="imoveis-grid">
        <div class="imovel-card">
            <div class="imovel-img"><i class="fas fa-home"></i></div>
            <div class="imovel-info">
                <h3>Cobertura Duplex</h3>
                <p>180m² • 4 suítes</p>
                <p class="preco">R$ 1.250.000</p>
            </div>
        </div>
        <div class="imovel-card">
            <div class="imovel-img"><i class="fas fa-building"></i></div>
            <div class="imovel-info">
                <h3>Apartamento Luxo</h3>
                <p>120m² • 3 quartos</p>
                <p class="preco">R$ 850.000</p>
            </div>
        </div>
        <div class="imovel-card">
            <div class="imovel-img"><i class="fas fa-tree"></i></div>
            <div class="imovel-info">
                <h3>Casa com Jardim</h3>
                <p>250m² • 4 quartos</p>
                <p class="preco">R$ 1.500.000</p>
            </div>
        </div>
    </div>
</body>
</html>
