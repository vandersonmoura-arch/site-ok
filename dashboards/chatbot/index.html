<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA | Vanderson Alves</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0A0A0A, #1A1A1A);
            color: #FCD34D;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            color: #FBBF24;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-voltar {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: transparent;
            color: #FBBF24;
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #FBBF24;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-voltar:hover {
            background: #FBBF24;
            color: #0A0A0A;
            transform: translateY(-2px);
        }

        .chat-container {
            background: #1A1A1A;
            border-radius: 15px;
            border: 1px solid #FBBF24;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.2);
            height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #FBBF24;
            color: #0A0A0A;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
        }

        .chat-header i {
            font-size: 1.8rem;
        }

        .chat-header .status {
            margin-left: auto;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.1);
            padding: 0.3rem 1rem;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #0A0A0A;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 15px;
            animation: fadeIn 0.3s;
            line-height: 1.5;
            position: relative;
        }

        .message.bot {
            background: #2D2D2D;
            align-self: flex-start;
            border: 1px solid #FBBF24;
            border-bottom-left-radius: 5px;
        }

        .message.user {
            background: #FBBF24;
            color: #0A0A0A;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message .time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.3rem;
            display: block;
        }

        .chat-input {
            display: flex;
            padding: 1.2rem;
            gap: 0.8rem;
            background: #1A1A1A;
            border-top: 1px solid #FBBF24;
        }

        .chat-input input {
            flex: 1;
            padding: 1rem;
            background: #2D2D2D;
            border: 1px solid #FBBF24;
            border-radius: 8px;
            color: #FCD34D;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .chat-input input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3);
        }

        .chat-input button {
            padding: 1rem 2rem;
            background: #FBBF24;
            color: #0A0A0A;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-input button:hover {
            background: #F59E0B;
            transform: translateY(-2px);
        }

        .suggestions {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.2rem;
            background: #1A1A1A;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        .suggestion-chip {
            padding: 0.5rem 1rem;
            background: #2D2D2D;
            border: 1px solid #FBBF24;
            border-radius: 20px;
            color: #FCD34D;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .suggestion-chip:hover {
            background: #FBBF24;
            color: #0A0A0A;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing {
            display: flex;
            gap: 0.3rem;
            padding: 1rem 1.2rem;
            background: #2D2D2D;
            border-radius: 15px;
            width: fit-content;
            border: 1px solid #FBBF24;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #FBBF24;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        @media (max-width: 768px) {
            .container { margin: 1rem auto; }
            .chat-container { height: 80vh; }
            .message { max-width: 90%; }
            .chat-input button { padding: 1rem; }
            .chat-input button span { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-robot"></i> 
                Assistente Virtual IA
            </h1>
            <a href="/" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar ao Portfólio
            </a>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <i class="fas fa-circle" style="color: #10B981; font-size: 0.8rem;"></i>
                <span>Chatbot IA - Online</span>
                <span class="status"><i class="fas fa-microchip"></i> GPT-4 Simulado</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <i class="fas fa-robot" style="margin-right: 0.5rem;"></i>
                    Olá! 👋 Sou seu assistente virtual. Como posso ajudar hoje?
                    <span class="time">12:00</span>
                </div>
            </div>

            <div class="suggestions" id="suggestions">
                <span class="suggestion-chip" onclick="useSuggestion('Quero fazer um orçamento')">💰 Quero fazer um orçamento</span>
                <span class="suggestion-chip" onclick="useSuggestion('Quais tecnologias você domina?')">💻 Tecnologias</span>
                <span class="suggestion-chip" onclick="useSuggestion('Tempo de entrega de um projeto')">⏱️ Prazo</span>
                <span class="suggestion-chip" onclick="useSuggestion('Portfólio de projetos')">📁 Ver portfólio</span>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                    <span>Enviar</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            if (isUser) {
                messageDiv.innerHTML = `${text}<span class="time">${timeStr}</span>`;
            } else {
                messageDiv.innerHTML = `<i class="fas fa-robot" style="margin-right: 0.5rem;"></i>${text}<span class="time">${timeStr}</span>`;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function getBotResponse(userMsg) {
            const msg = userMsg.toLowerCase();
            
            if (msg.includes('orçamento') || msg.includes('quanto custa')) {
                return "Para um orçamento personalizado, preciso saber mais sobre seu projeto. Me conte brevemente o que você precisa! Valores variam de R$ 1.500 a R$ 15.000 dependendo da complexidade.";
            }
            else if (msg.includes('tecnologia') || msg.includes('domina')) {
                return "Minhas principais tecnologias são: React, Vue.js, Node.js, Python, e bancos de dados SQL/NoSQL. Também trabalho com UI/UX design e integração de APIs.";
            }
            else if (msg.includes('prazo') || msg.includes('entrega')) {
                return "Prazos variam conforme o projeto: Landing Pages (1-2 semanas), Dashboards (2-4 semanas), Sistemas Completos (1-3 meses). Posso te dar um prazo exato após análise dos requisitos!";
            }
            else if (msg.includes('portfólio') || msg.includes('projetos')) {
                return "Meu portfólio inclui dashboards financeiros, landing pages e sistemas administrativos. Você pode ver todos os projetos no link principal do site!";
            }
            else if (msg.includes('contato') || msg.includes('whatsapp')) {
                return "Você pode me chamar no WhatsApp clicando no botão na página principal ou enviar um e-mail para vandersonmoura@icloud.com";
            }
            else if (msg.includes('oi') || msg.includes('olá') || msg.includes('hello')) {
                return "Olá! 😊 Como posso te ajudar hoje?";
            }
            else if (msg.includes('obrigado') || msg.includes('valeu')) {
                return "Por nada! Estou aqui para ajudar. Se precisar de mais alguma coisa, é só falar! 👍";
            }
            else {
                return "Interessante! Para informações mais precisas, sugiro entrarmos em contato diretamente. Quer que eu passe algumas opções de contato?";
            }
        }

        function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;

            addMessage(msg, true);
            userInput.value = '';

            showTyping();

            setTimeout(() => {
                removeTyping();
                const response = getBotResponse(msg);
                addMessage(response);
            }, 1500);
        }

        function useSuggestion(text) {
            userInput.value = text;
            sendMessage();
        }
    </script>
</body>
</html>
