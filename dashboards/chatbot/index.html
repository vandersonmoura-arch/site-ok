<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA | Vanderson Alves</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container principal */
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: #1A1A1A;
            border: 2px solid #FBBF24;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: #0A0A0A;
            padding: 15px 20px;
            border-bottom: 2px solid #FBBF24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left i {
            font-size: 30px;
            color: #FBBF24;
        }

        .header-left h1 {
            color: #FBBF24;
            font-size: 1.3rem;
        }

        .header-left p {
            color: #9CA3AF;
            font-size: 0.8rem;
        }

        .btn-voltar {
            color: #FBBF24;
            text-decoration: none;
            border: 1px solid #FBBF24;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* Área de mensagens */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #1A1A1A;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Mensagens */
        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bot-message {
            align-self: flex-start;
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: #FBBF24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0A0A0A;
        }

        .message-content {
            padding: 10px 15px;
            border-radius: 10px;
            background: #0A0A0A;
            color: #FCD34D;
        }

        .user-message .message-content {
            background: #FBBF24;
            color: #0A0A0A;
        }

        /* Input area */
        .chat-input-area {
            padding: 15px 20px;
            background: #0A0A0A;
            border-top: 1px solid #FBBF24;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background: #1A1A1A;
            border: 1px solid #FBBF24;
            border-radius: 5px;
            color: #FCD34D;
        }

        .chat-input-area button {
            width: 40px;
            height: 40px;
            background: #FBBF24;
            border: none;
            border-radius: 5px;
            color: #0A0A0A;
            cursor: pointer;
        }

        /* Opções rápidas */
        .quick-options {
            padding: 0 20px 15px 20px;
            background: #1A1A1A;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-option {
            padding: 8px 15px;
            background: #0A0A0A;
            border: 1px solid #FBBF24;
            border-radius: 20px;
            color: #FBBF24;
            cursor: pointer;
        }

        /* Celular */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .chat-container {
                height: 90vh;
                max-width: 100%;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <i class="fas fa-robot"></i>
                <div>
                    <h1>Assistente Virtual</h1>
                    <p>Online</p>
                </div>
            </div>
            <a href="/" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- Mensagens -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    Olá! Como posso ajudar?
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite sua mensagem...">
            <button id="sendButton">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <!-- Opções rápidas -->
        <div class="quick-options">
            <button class="quick-option">Serviços</button>
            <button class="quick-option">Projetos</button>
            <button class="quick-option">Contato</button>
        </div>
    </div>

    <script>
        // JavaScript básico para o chat funcionar
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('userInput');
            const button = document.getElementById('sendButton');
            const messages = document.getElementById('chatMessages');

            function sendMessage() {
                const text = input.value.trim();
                if (text === '') return;

                // Mensagem do usuário
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerHTML = `
                    <div class="message-content">${text}</div>
                    <div class="avatar"><i class="fas fa-user"></i></div>
                `;
                messages.appendChild(userDiv);
                input.value = '';

                // Resposta do bot
                setTimeout(() => {
                    const botDiv = document.createElement('div');
                    botDiv.className = 'message bot-message';
                    botDiv.innerHTML = `
                        <div class="avatar"><i class="fas fa-robot"></i></div>
                        <div class="message-content">Obrigado pela mensagem! Em breve responderei.</div>
                    `;
                    messages.appendChild(botDiv);
                    messages.scrollTop = messages.scrollHeight;
                }, 1000);

                messages.scrollTop = messages.scrollHeight;
            }

            button.addEventListener('click', sendMessage);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // Opções rápidas
            document.querySelectorAll('.quick-option').forEach(btn => {
                btn.addEventListener('click', function() {
                    input.value = this.textContent;
                    sendMessage();
                });
            });
        });
    </script>
</body>
</html>
