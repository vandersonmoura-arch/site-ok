<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Instalações Elétricas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #FF6B00; --secondary: #001F3F; }
        body { font-family: 'Segoe UI', sans-serif; background: #F5F5F5; }
        .header-site { background: var(--secondary); padding: 20px; border-bottom: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo img { height: 50px; }
        .logo h1 { color: var(--primary); font-size: 1.5rem; }
        .btn-voltar { color: white; text-decoration: none; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 5px; }
        .conteudo { margin-top: 100px; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .hero { text-align: center; padding: 60px 20px; background: var(--secondary); border-radius: 20px; margin-bottom: 40px; border: 1px solid var(--primary); color: white; }
        .hero h2 { font-size: 3rem; color: var(--primary); }
        .btn-whatsapp { display: inline-block; background: #25D366; color: white; text-decoration: none; padding: 15px 30px; border-radius: 50px; margin: 10px; }
        footer { text-align: center; padding: 30px; border-top: 2px solid var(--primary); margin-top: 40px; background: var(--secondary); color: white; }
    </style>
</head>
<body>
    <header class="header-site">
        <div class="logo">
            <img src="img/logo.png" alt="MR">
            <h1>MR Instalações Elétricas</h1>
        </div>
        <a href="/" class="btn-voltar">Voltar</a>
    </header>
    <main class="conteudo">
        <div class="container">
            <section class="hero">
                <h2>⚡ MR Instalações Elétricas</h2>
                <p>Especialistas em instalações elétricas e automação.</p>
                <a href="https://wa.me/551997294704" target="_blank" class="btn-whatsapp">WhatsApp</a>
            </section>
        </div>
    </main>
    <footer>
        <p>MR Instalações Elétricas © 2024</p>
    </footer>
</body>
</html>
