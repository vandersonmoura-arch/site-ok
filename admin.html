<!DOCTYPE html>

<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin</title>

<style>

body{
font-family:Arial;
max-width:600px;
margin:40px auto;
}

input,button{
width:100%;
padding:10px;
margin:10px 0;
}

button{
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Painel de Projetos</h1>

<form id="formProjeto">

<label>Nome do Projeto</label> <input type="text" id="nome" required>

<label>Tecnologia</label> <input type="text" id="tecnologia" required>

<button type="submit">Adicionar Projeto</button>

</form>

<p id="mensagem"></p>

<script>

const form = document.getElementById("formProjeto")

form.addEventListener("submit", async (e)=>{

e.preventDefault()

const nome = document.getElementById("nome").value
const tecnologia = document.getElementById("tecnologia").value

const resposta = await fetch("http://localhost:3000/projetos",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
nome,
tecnologia
})

})

const dados = await resposta.json()

document.getElementById("mensagem").innerText = dados.mensagem

form.reset()

})

</script>

</body>
</html>
